<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONG Esperança | Cadastro de Voluntários</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <img src="../imgs/logo_ong.jpeg" alt="Logotipo da ONG Esperança">
        <button type="button" class="menu-toggle" aria-label="Abrir menu de navegação" aria-expanded="false">☰</button>
        <nav>
            <ul class="nav-list">
                <li><a href="/" data-link>Início</a></li>
                <li><a href="/projetos" data-link>Projetos Sociais</a></li>
                <li><a href="/cadastro" data-link>Cadastro de Voluntários</a></li>
            </ul>
        </nav>
    </header>

    <main class="grid-container">
        <div class="full-width">
            <h1>Cadastro de Voluntários</h1>
            <div class="alert alert-success" role="status" hidden>
                <strong>Cadastro realizado!</strong> Seus dados foram salvos. Em breve nossa equipe fará contato.
            </div>
        </div>
        
        <form action="#" method="POST" class="full-width card">
            <fieldset>
                <legend>Dados Pessoais</legend>
                <div class="form-group">
                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                </div>
                <div class="form-group">
                    <label for="cpf">CPF (com pontuação):</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" maxlength="14" required title="Formato exigido: 000.000.000-00">
                </div>
                <div class="form-group">
                    <label for="nascimento">Data de Nascimento:</label>
                    <input type="date" id="nascimento" name="nascimento" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Endereço e Comunicação</legend>
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
                </div>
                <div class="form-group">
                    <label for="telefone">Telefone (com DDD e traço):</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(99) 99999-9999" pattern="\(\d{2}\)\s\d{4,5}-\d{4}" maxlength="15" required title="Formato exigido: (99) 99999-9999">
                </div>
                <div class="form-group">
                    <label for="cep">CEP (com traço):</label>
                    <input type="text" id="cep" name="cep" placeholder="00000-000" pattern="\d{5}-\d{3}" maxlength="9" required title="Formato exigido: 00000-000">
                </div>
            </fieldset>

            <button type="submit" class="btn">Enviar Cadastro</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 ONG Esperança. Todos os direitos reservados.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="../js/app.js"></script>
</body>
</html>
